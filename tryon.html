<html>

    <div class="card">
        <h2>✨ Features</h2>

        <p>✔ Real-Time Preview</p>

<script>

function showLook(){
document.getElementById("look").innerHTML=
"👕 Hoodie successfully matched to your body";
}

</script>

</body>
